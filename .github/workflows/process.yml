name: process-images
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated filename filters (empty = all)"
        required: false
        default: ""
  push:
    paths: ["sources.json", "process.py", "run.txt", "outdir.txt"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "rembg[cpu]" pillow numpy
      - run: OUT_DIR=$(cat outdir.txt 2>/dev/null || echo out) python process.py ${{ github.event.inputs.only }} $(cat run.txt 2>/dev/null)
      - run: |
          git config user.name "nero-bot"; git config user.email "bot@users.noreply.github.com"
          git add out* && git commit -m "Processed images" || echo "nothing to commit"
          git push
